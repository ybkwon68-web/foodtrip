<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지도로 보기 · 백반기행 아카이브</title>
<meta name="description" content="허영만의 백반기행에 소개된 식당들을 지도에서 한눈에 확인">
<meta property="og:type" content="website">
<meta property="og:site_name" content="백반기행 아카이브">
<meta property="og:title" content="지도로 보기 · 백반기행 아카이브">
<meta property="og:description" content="허영만의 백반기행에 소개된 식당들을 지도에서 한눈에 확인">
<meta property="og:url" content="https://foodtrip-six.vercel.app/map.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="지도로 보기 · 백반기행 아카이브">
<meta name="twitter:description" content="허영만의 백반기행에 소개된 식당들을 지도에서 한눈에 확인">
<link rel="stylesheet" href="./style.css">
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=kph5ji8tv4"></script>
<script src="./vendor/MarkerClustering.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="./index.html">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="brand-icon">
      <path d="M4 11a8 8 0 0 0 16 0Z"></path>
      <path d="M4 11h16"></path>
      <path d="M12 3v3M8 4l1 3M16 4l-1 3"></path>
    </svg>
    <span class="wordmark">백반기행 아카이브<small>지도로 보기</small></span>
  </a>
  <div class="mobile-view-switch">
    <a class="view-pill active" href="./map.html">지도</a>
    <a class="view-pill" href="./table.html">표</a>
  </div>
  <div class="controls">
    <div class="controls-row">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="mapSearch" placeholder="제목, 식당명, 지역으로 검색">
      </div>
      <a class="edit-toggle" href="./manual.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        사용법
      </a>
      <a class="edit-toggle" href="./table.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1.5"></rect><path d="M3 10h18M9 10v10"></path></svg>
        표로 보기
      </a>
      <a class="edit-toggle" href="./index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11a8 8 0 0 0 16 0Z"></path><path d="M4 11h16"></path></svg>
        카드로 보기
      </a>
    </div>
  </div>
</header>

<main class="map-page">
  <p class="result-count" id="mapCount"></p>
  <div class="map-wrap">
    <div id="map"></div>
    <button type="button" id="mapLocateBtn" class="map-locate-btn" title="내 위치로 보기">📍</button>
  </div>
  <p id="mapLocateStatus" class="map-locate-status" hidden></p>
  <p class="map-note">※ 주소만 있고 좌표가 없는 식당은 지도에 표시되지 않습니다.</p>
</main>

<script src="./map.js"></script>
</body>
</html>
