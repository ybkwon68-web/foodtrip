<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>백반기행 아카이브</title>
<meta name="description" content="허영만의 백반기행 방송 회차를 회차별로 정리한 아카이브">
<meta name="naver-site-verification" content="cce79a8a40b733c45c85be93f386ed5afb261a8a" />
<meta property="og:type" content="website">
<meta property="og:site_name" content="백반기행 아카이브">
<meta property="og:title" content="백반기행 아카이브">
<meta property="og:description" content="허영만의 백반기행 방송 회차를 회차별로 정리한 아카이브">
<meta property="og:url" content="https://foodtrip-six.vercel.app/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="백반기행 아카이브">
<meta name="twitter:description" content="허영만의 백반기행 방송 회차를 회차별로 정리한 아카이브">
<link rel="stylesheet" href="./style.css">
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="#/">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="brand-icon">
      <path d="M4 11a8 8 0 0 0 16 0Z"></path>
      <path d="M4 11h16"></path>
      <path d="M12 3v3M8 4l1 3M16 4l-1 3"></path>
    </svg>
    <span class="wordmark">백반기행 아카이브<small>허영만의 백반기행 · 회차별 정리</small></span>
  </a>
  <div class="mobile-view-switch">
    <a class="view-pill" href="./map.html">지도</a>
    <a class="view-pill" href="./table.html">표</a>
  </div>
  <div class="controls">
    <div class="controls-row">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="searchInput" placeholder="제목, 지역으로 검색">
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="latest">최신순</option>
        <option value="episode">회차순</option>
      </select>
      <div class="desktop-nav-links">
        <a class="edit-toggle" href="./manual.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          사용법
        </a>
        <a class="edit-toggle" href="./table.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1.5"></rect><path d="M3 10h18M9 10v10"></path></svg>
          표로 보기
        </a>
        <a class="edit-toggle" href="./map.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 20l-6-3V5l6 3 6-3 6 3v12l-6-3-6 3z"></path><path d="M9 5v15M15 8v15"></path></svg>
          지도로 보기
        </a>
        <a class="edit-toggle" id="addEntryLink" href="./add.html" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"></path></svg>
          추가등록
        </a>
        <a class="edit-toggle" id="commentsEntryLink" href="./comments.html" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
          제보관리
        </a>
        <button class="edit-toggle" id="editToggle" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
          편집 모드
        </button>
      </div>
    </div>
    <div class="right-links">
      <a class="site-link" id="auctionLink" href="https://auction-two-alpha.vercel.app/" target="_blank" rel="noopener">auction</a>
      <a class="site-link" id="assetLink" href="https://dashboard-two-topaz.vercel.app/" target="_blank" rel="noopener">asset</a>
    </div>
    <span class="creator-credit">만든이 powermanimda!</span>
  </div>
</header>

<main id="app">
  <section id="recommendBox" class="recommend-box">
    <button type="button" class="recommend-toggle" id="recommendToggle" aria-expanded="false" aria-controls="recommendPanel">
      <span>오늘 뭐 먹지? 조건을 알려주면 어울리는 식당을 찾아드려요</span>
      <svg class="recommend-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div class="recommend-panel" id="recommendPanel">
      <form id="recommendForm">
        <label for="recommendInput" class="recommend-label">오늘 뭐 먹지? 조건을 알려주면 어울리는 식당을 찾아드려요</label>
        <div class="recommend-input-row">
          <textarea id="recommendInput" rows="1" placeholder="예: 지금 나는 과천인데, 가끔 보는 친구들과 가볍게 저녁식사를 하면서 술을 한잔 할 수 있는 조용한 분위기의 식당을 알려줘. 과천에서 이동거리 1시간 이내로 해서"></textarea>
          <div class="recommend-buttons">
            <button type="button" id="recommendLocationBtn" class="recommend-location-btn" title="현재 위치를 사용해 추천받기">📍 내 위치</button>
            <button type="submit" id="recommendSubmit">추천받기</button>
          </div>
        </div>
        <p id="recommendLocationStatus" class="recommend-location-status" hidden></p>
      </form>
      <div id="recommendResult" class="recommend-result" hidden></div>
    </div>
  </section>

  <section id="listView">
    <p class="result-count" id="resultCount"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="detailView" hidden></section>
</main>

<section id="adminCheckPanel" class="admin-check-panel" hidden>
  <h3>폐업·이전 자동 점검</h3>
  <div class="admin-check-body">
    <div class="admin-check-controls">
      <div class="admin-check-form">
        <label>시작 회차 <input type="number" id="checkFromEpisode" min="1" max="352" value="1"></label>
        <label>끝 회차 <input type="number" id="checkToEpisode" min="1" max="352" value="10"></label>
        <label class="admin-check-apply"><input type="checkbox" id="checkApplyMode"> 실제 반영(체크 안 하면 결과만 확인)</label>
        <button type="button" id="checkStartBtn">실행</button>
        <button type="button" id="checkStopBtn" hidden>중지</button>
      </div>
      <p id="checkProgress" class="admin-check-progress"></p>
    </div>
    <div id="checkResults" class="admin-check-results"></div>
  </div>
</section>

<script src="./lib/episodesLogic.js"></script>
<script src="./lib/editModeFlow.js"></script>
<script src="./lib/mobileHome.js"></script>
<script src="./script.js"></script>
<script src="./recommend.js"></script>
</body>
</html>
