<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회차별 요약표 · 백반기행 아카이브</title>
<meta name="description" content="허영만의 백반기행 회차별 식당·메뉴·한줄평·주소 요약표">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="./index.html">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="brand-icon">
      <path d="M4 11a8 8 0 0 0 16 0Z"></path>
      <path d="M4 11h16"></path>
      <path d="M12 3v3M8 4l1 3M16 4l-1 3"></path>
    </svg>
    <span class="wordmark">백반기행 아카이브<small>회차별 요약표</small></span>
  </a>
  <div class="controls">
    <div class="controls-row">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="text" id="tableSearch" placeholder="회차, 식당명, 지역으로 검색">
      </div>
      <a class="edit-toggle" href="./map.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 20l-6-3V5l6 3 6-3 6 3v12l-6-3-6 3z"></path><path d="M9 5v15M15 8v15"></path></svg>
        지도로 보기
      </a>
      <a class="edit-toggle" href="./index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11a8 8 0 0 0 16 0Z"></path><path d="M4 11h16"></path></svg>
        카드로 보기
      </a>
    </div>
  </div>
</header>

<main class="table-page">
  <p class="result-count" id="tableCount"></p>
  <div class="table-scroll">
    <table class="ep-table">
      <thead>
        <tr>
          <th class="col-ep">회차</th>
          <th>식당명</th>
          <th>소개된 메뉴</th>
          <th>한줄평</th>
          <th class="filterable-th">도/특별시/광역시<button type="button" class="col-filter-btn" data-field="sido" aria-label="도/특별시/광역시 필터">▾</button></th>
          <th class="filterable-th">시/군/구<button type="button" class="col-filter-btn" data-field="sigungu" aria-label="시/군/구 필터">▾</button></th>
          <th>상세주소</th>
          <th>지도</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<div class="col-filter-menu" id="colFilterMenu" hidden>
  <div class="col-filter-search">
    <input type="text" id="colFilterSearch" placeholder="검색">
  </div>
  <div class="col-filter-selectall">
    <label><input type="checkbox" id="colFilterAll"> (모두 선택)</label>
  </div>
  <div class="col-filter-list" id="colFilterList"></div>
  <div class="col-filter-actions">
    <button type="button" id="colFilterOk">확인</button>
    <button type="button" id="colFilterCancel">취소</button>
  </div>
</div>

<script src="./table.js"></script>
</body>
</html>
